name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyflakes

      - name: Lint
        run: python -m pyflakes main.py build.py ytgui tests

      - name: Test
        run: python -m pytest -q

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: youtube-downloader-windows
            path: dist/YouTube-Downloader.exe
            args: --with-ffmpeg
          - os: ubuntu-22.04
            artifact: youtube-downloader-linux
            path: dist/YouTube-Downloader-Linux
            args: ""
          - os: macos-latest
            artifact: youtube-downloader-macos
            path: dist/YouTube-Downloader-macOS.app
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build
        run: python build.py ${{ matrix.args }}

      - name: Zip macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/YouTube-Downloader-macOS.app dist/YouTube-Downloader-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.os == 'macOS' && 'dist/YouTube-Downloader-macOS.zip' || matrix.path }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4

      - name: Package
        run: |
          (cd youtube-downloader-windows && zip -r ../YouTube-Downloader-Windows.zip .)
          chmod +x youtube-downloader-linux/YouTube-Downloader-Linux
          tar -czf YouTube-Downloader-Linux.tar.gz -C youtube-downloader-linux .
          cp youtube-downloader-macos/YouTube-Downloader-macOS.zip .
          ls -la

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            YouTube-Downloader-Windows.zip
            YouTube-Downloader-Linux.tar.gz
            YouTube-Downloader-macOS.zip
          body: |
            ## YouTube Downloader ${{ github.ref_name }}

            **Windows:** download `YouTube-Downloader-Windows.zip`, extract and run `YouTube-Downloader.exe` (FFmpeg included).
            **Linux:** `tar -xzf YouTube-Downloader-Linux.tar.gz && ./YouTube-Downloader-Linux` (needs `ffmpeg`).
            **macOS:** unzip `YouTube-Downloader-macOS.zip` and open the app (needs `brew install ffmpeg`).

            ### Highlights
            - Videos, Shorts, playlists, channels and YouTube search
            - Up to 8K / HDR / 60 fps with size estimates, or MP3 / M4A / Opus / FLAC / WAV
            - Download queue with pause, resume, cancel and retry
            - Cover art, metadata, chapters, subtitles and SponsorBlock
            - History, clipboard detection, light/dark themes, Turkish & English
